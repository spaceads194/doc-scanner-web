<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan Document</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#0b0d10; --card:#171a1f; --line:#2a2f37; --fg:#f2f4f7; --mute:#9aa3af; --ok:#22c55e; --brand:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,"Sarabun","Noto Sans Thai",system-ui,sans-serif; overflow:hidden; }
  .hidden { display:none !important; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  button { font:inherit; color:inherit; border:0; border-radius:14px; padding:12px 16px; background:var(--card); cursor:pointer; }
  button:active { transform:scale(.97); }
  button.primary { background:var(--brand); color:#111; font-weight:700; }
  button.ok { background:var(--ok); color:#07210f; font-weight:700; }
  button.danger { background:#3b1417; color:#fca5a5; }
  button:disabled { opacity:.4; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--mute); margin:0 0 16px; font-size:14px; }

  /* เลือกประเภท */
  #s-type { padding:max(20px,env(safe-area-inset-top)) 16px 16px; overflow:auto; }
  .typebtn { display:block; width:100%; text-align:left; padding:18px; margin-bottom:10px; font-size:17px; border:2px solid var(--line); }
  .typebtn.sel { border-color:var(--brand); background:#2a2110; }
  #otherName { width:100%; padding:14px; font-size:17px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--fg); margin:4px 0 12px; }
  #resume { background:#10261a; border:1px solid #1f6b3a; border-radius:14px; padding:12px; margin-bottom:14px; font-size:14px; }
  #resume button { margin:8px 8px 0 0; padding:8px 12px; }

  /* กล้อง */
  #s-cam { background:#000; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #guide { position:absolute; border:3px solid rgba(255,255,255,.9); border-radius:10px; box-shadow:0 0 0 9999px rgba(0,0,0,.45); pointer-events:none; transition:border-color .2s; }
  #guide.ready { border-color:var(--ok); }
  #guide i { position:absolute; width:22px; height:22px; border:5px solid var(--brand); }
  #guide i:nth-child(1){ left:-4px; top:-4px; border-right:0; border-bottom:0; border-radius:10px 0 0 0; }
  #guide i:nth-child(2){ right:-4px; top:-4px; border-left:0; border-bottom:0; border-radius:0 10px 0 0; }
  #guide i:nth-child(3){ left:-4px; bottom:-4px; border-right:0; border-top:0; border-radius:0 0 0 10px; }
  #guide i:nth-child(4){ right:-4px; bottom:-4px; border-left:0; border-top:0; border-radius:0 0 10px 0; }
  #top { position:absolute; top:0; left:0; right:0; padding:max(10px,env(safe-area-inset-top)) 12px 8px; display:flex; gap:8px; align-items:center; background:linear-gradient(#000a,#0000); }
  #top .chip { background:#000a; padding:8px 12px; border-radius:20px; font-size:14px; max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #top .sp { flex:1; }
  #top button { padding:8px 12px; background:#000a; font-size:14px; }
  #count { background:var(--brand); color:#111; font-weight:700; }
  #hint { position:absolute; left:0; right:0; text-align:center; font-size:15px; text-shadow:0 1px 4px #000; padding:0 20px; }
  #bottom { position:absolute; left:0; right:0; bottom:0; padding:8px 12px max(12px,env(safe-area-inset-bottom)); background:linear-gradient(#0000,#000c 30%); }
  #strip { display:flex; gap:8px; overflow-x:auto; padding:6px 0 10px; min-height:70px; }
  #strip .th { position:relative; flex:0 0 auto; width:48px; height:62px; border-radius:6px; background:#222 center/cover no-repeat; border:2px solid #fff4; }
  #strip .th b { position:absolute; right:2px; bottom:2px; background:#000b; font-size:11px; padding:0 4px; border-radius:6px; }
  #ctrl { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #ctrl .side { flex:1; display:flex; }
  #ctrl .side.r { justify-content:flex-end; }
  #shutter { width:78px; height:78px; border-radius:50%; background:#fff; border:6px solid #fff6; background-clip:padding-box; padding:0; flex:0 0 auto; }
  #shutter:active { background:var(--brand); }
  #top, #bottom, #hint { z-index:3; }
  #camMsg { z-index:2; position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; gap:12px; background:#000a; }
  #camMsg p { margin:0; color:var(--mute); }

  /* Review sheet */
  #review { position:fixed; inset:0; background:#000e; display:flex; flex-direction:column; z-index:10; padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  #rvTop { display:flex; align-items:center; gap:8px; padding-bottom:8px; }
  #rvTop .sp { flex:1; text-align:center; font-weight:700; }
  #rvImg { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #rvImg img { max-width:100%; max-height:100%; object-fit:contain; background:#fff; border-radius:4px; }
  #rvInfo { text-align:center; font-size:13px; color:var(--mute); padding:6px 0; }
  .seg { display:flex; gap:6px; margin-bottom:8px; }
  .seg button { flex:1; padding:10px 4px; font-size:14px; }
  .seg button.on { background:var(--brand); color:#111; font-weight:700; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }

  /* ปรับมุม */
  #corner { position:fixed; inset:0; height:100vh; height:100dvh; background:#000; z-index:20; display:flex; flex-direction:column; gap:10px; padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  #cnTitle { text-align:center; font-size:14px; color:var(--mute); }
  #cnBox { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #cnWrap { position:relative; display:inline-block; line-height:0; touch-action:none; }
  #cnImg { display:block; max-width:calc(100vw - 24px); max-height:calc(100vh - 250px); max-height:calc(100dvh - 250px); }
  #corner .row { flex-shrink:0; }
  #cnSvg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #cnPoly { fill:rgba(245,158,11,.15); stroke:#f59e0b; stroke-width:3; vector-effect:non-scaling-stroke; }
  .hd { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; border:3px solid #f59e0b; background:rgba(245,158,11,.18); touch-action:none; }

  /* Finish */
  #s-fin { padding:max(20px,env(safe-area-inset-top)) 16px 16px; overflow:auto; align-items:stretch; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .card .k { color:var(--mute); font-size:13px; } .card .v { font-size:16px; word-break:break-all; margin-bottom:8px; }
  .bar { height:8px; background:#222; border-radius:6px; overflow:hidden; margin:10px 0; }
  .bar > div { height:100%; width:0; background:var(--brand); transition:width .2s; }
  .err { color:#fca5a5; }
  a.btn { display:block; text-align:center; text-decoration:none; background:var(--card); padding:12px; border-radius:14px; color:var(--fg); margin-bottom:8px; }
</style>
</head>
<body>

<!-- 1) เลือกประเภท -->
<section id="s-type" class="screen">
  <h1>สแกนเอกสาร</h1>
  <p class="sub">เลือกประเภทเอกสารก่อนเริ่มสแกน</p>
  <div id="resume" class="hidden"></div>
  <div id="typeList"></div>
  <input id="otherName" class="hidden" maxlength="60" placeholder="ชื่อเอกสาร เช่น สัญญาเช่า, สำเนาบัตรประชาชน">
  <button id="btnStart" class="primary" style="padding:16px;font-size:18px" disabled>เริ่มสแกน</button>
</section>

<!-- 2) กล้อง -->
<section id="s-cam" class="screen hidden">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="guide"><i></i><i></i><i></i><i></i></div>
  <div id="top">
    <button id="btnBack">‹</button>
    <div class="chip" id="typeChip"></div>
    <div class="sp"></div>
    <button id="btnOrient" title="สลับแนวกรอบ">⟲ กรอบ</button>
    <button id="btnTorch" class="hidden">🔦</button>
    <div class="chip" id="count">0 หน้า</div>
  </div>
  <div id="hint"></div>
  <div id="bottom">
    <div id="strip"></div>
    <div id="ctrl">
      <div class="side"><button id="btnPick">🖼 เลือกรูป</button></div>
      <button id="shutter" aria-label="ถ่ายภาพ"></button>
      <div class="side r"><button id="btnFinish" class="ok" disabled>Finish ✓</button></div>
    </div>
  </div>
  <div id="camMsg" class="hidden"></div>
</section>

<!-- Review -->
<div id="review" class="hidden">
  <div id="rvTop">
    <button id="rvPrev">◀</button><div class="sp" id="rvTitle"></div><button id="rvNext">▶</button>
  </div>
  <div id="rvImg"><img id="rvPic" alt=""></div>
  <div id="rvInfo"></div>
  <div class="seg" id="rvMode">
    <button data-m="color">สี (คมชัด)</button><button data-m="bw">ขาวดำ</button><button data-m="orig">ต้นฉบับ</button>
  </div>
  <div class="seg"><button id="rvCrop">ตัดขอบอัตโนมัติ: เปิด</button><button id="rvCorners">✥ ปรับมุมกระดาษ</button></div>
  <button id="rvFinish" class="ok" style="width:100%;padding:14px;margin-bottom:8px;font-size:16px">Finish ✓ สร้าง PDF (<span id="rvN">0</span> หน้า)</button>
  <div class="row">
    <button id="rvRetake">↺ ถ่ายใหม่</button>
    <button id="rvDelete" class="danger">🗑 ลบหน้า</button>
    <button id="rvDone" class="primary">ถัดไป ›</button>
  </div>
</div>

<!-- ปรับมุม -->
<div id="corner" class="hidden">
  <div id="cnTitle">ลากวงกลมสีส้มไปวางที่ “มุมกระดาษ” ทั้ง 4 มุม</div>
  <div id="cnBox"><div id="cnWrap"><img id="cnImg" alt="">
    <svg id="cnSvg" viewBox="0 0 1 1" preserveAspectRatio="none"><polygon id="cnPoly" points=""/></svg>
    <div class="hd" data-i="0"></div><div class="hd" data-i="1"></div><div class="hd" data-i="2"></div><div class="hd" data-i="3"></div>
  </div></div>
  <div class="row"><button id="cnCancel">ยกเลิก</button><button id="cnReset">รีเซ็ต</button><button id="cnOk" class="primary">ใช้ค่านี้</button></div>
</div>

<!-- 3) Finish -->
<section id="s-fin" class="screen hidden">
  <h1 id="finTitle">สร้าง PDF</h1>
  <div class="card">
    <div class="k">ประเภทเอกสาร</div><div class="v" id="finType"></div>
    <div class="k">จำนวนหน้า</div><div class="v" id="finPages"></div>
    <div id="finResult"></div>
  </div>
  <div class="bar" id="finBar"><div></div></div>
  <div id="finMsg" style="margin-bottom:12px"></div>
  <div id="finBtns"></div>
</section>

<input id="fileCam" type="file" accept="image/*" capture="environment" class="hidden">
<input id="filePick" type="file" accept="image/*" multiple class="hidden">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ตั้งค่าครั้งเดียว: URL เว็บแอป Apps Script (/exec) ที่ Deploy แล้ว (ส่ง ?api=... ทับได้)
const API_URL = 'https://script.google.com/macros/s/AKfycbzB_HXQnwrpu0Mz6mIiRlcieVPVoqgZZOUZVSiJcyO0RW9miyKvXJKuKGtJe67HV6HC/exec';
const Q = new URLSearchParams(location.search);
const TYPES = [
  { id: 'cash_bill', label: 'บิลเงินสด' },
  { id: 'tax_invoice', label: 'ใบกำกับภาษี / ใบเสร็จ' },
  { id: 'receipt', label: 'ใบเสร็จ' },
  { id: 'other', label: 'เอกสารอื่น ๆ' },
];
const normT = v => String(v || '').replace(/[\s.ๆ:：]/g, '').toLowerCase();
function resolveTypeId(v) {
  const n = normT(v); if (!n) return '';
  if (n.indexOf('เอกสารอื่น') === 0 || n === 'other') return 'other';
  const t = TYPES.find(t => t.id === v || normT(t.label) === n || (t.id === 'tax_invoice' && n === normT('ใบกำกับภาษี')));
  return t ? t.id : '';
}
const rUrl = Q.get('returnUrl') || '';
const BOOT = {
  types: TYPES, typeId: resolveTypeId(Q.get('type')), other: (Q.get('other') || '').slice(0, 60),
  user: Q.get('user') || '', rowId: (Q.get('id') || '').slice(0, 100), token: Q.get('t') || '',
  app: Q.get('app') || '', sheet: Q.get('sheet') || '', tab: Q.get('tab') || '', sub: Q.get('sub') || '',
  returnUrl: /^https:\/\/([a-z0-9-]+\.)*appsheet\.com\//i.test(rUrl) ? rUrl : '',
  api: Q.get('api') || API_URL,
};

</script>
<script>
'use strict';
/* ═════════ ค่าคงที่ ═════════ */
const MAX_SIDE = 1800;          // ด้านยาวสุดของหน้า PDF (px)
const JPEG_Q = 0.86;
const CHUNK = 90000;            // ตัวอักษร base64 ต่อก้อน
const CHUNKS_PER_CALL = 4;
const A4 = 1 / 1.414;

const $ = id => document.getElementById(id);
const state = {
  typeId: BOOT.typeId || '', other: BOOT.other || '',
  sid: '', pages: [], stream: null, portrait: true, retakeId: null,
  reviewIdx: -1, torch: false, busy: false, pdf: null, detTimer: 0,
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10)).replace(/[^A-Za-z0-9_-]/g, '');
const typeLabel = () => { const t = BOOT.types.find(t => t.id === state.typeId); return t ? (state.typeId === 'other' ? (state.other || t.label) : t.label) : ''; };
const show = id => { ['s-type', 's-cam', 's-fin'].forEach(s => $(s).classList.toggle('hidden', s !== id)); };

/* ═════════ IndexedDB: กันงานหายระหว่างสแกน ═════════ */
const DB = (() => {
  let db = null;
  const open = () => new Promise(res => {
    try {
      const r = indexedDB.open('scanner-v1', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('pages', { keyPath: 'id' }); };
      r.onsuccess = () => { db = r.result; res(db); };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  const tx = (store, mode, fn) => new Promise(res => {
    if (!db) return res(null);
    try {
      const t = db.transaction(store, mode); const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : true); t.onerror = t.onabort = () => res(null);
    } catch (e) { res(null); }
  });
  return {
    open,
    putPage: p => tx('pages', 'readwrite', s => s.put({ id: p.id, orig: p.orig, quad: p.quad, guide: p.guide, crop: p.crop, mode: p.mode, proc: p.proc, w: p.w, h: p.h })),
    delPage: id => tx('pages', 'readwrite', s => s.delete(id)),
    getPage: id => tx('pages', 'readonly', s => s.get(id)),
    setSession: () => tx('kv', 'readwrite', s => s.put({ sid: state.sid, typeId: state.typeId, other: state.other, ids: state.pages.map(p => p.id) }, 'session')),
    getSession: () => tx('kv', 'readonly', s => s.get('session')),
    clear: () => new Promise(res => { if (!db) return res(); try { const t = db.transaction(['kv', 'pages'], 'readwrite'); t.objectStore('kv').clear(); t.objectStore('pages').clear(); t.oncomplete = t.onerror = t.onabort = () => res(); } catch (e) { res(); } }),
  };
})();
/* ═════════ Image helpers ═════════ */
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const toBlob = (c, q) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
function blobToCanvas(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => { const c = mkCanvas(img.naturalWidth, img.naturalHeight); c.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(url); res(c); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image_load')); };
    img.src = url;
  });
}
function downscale(c, maxSide) {
  const s = Math.min(1, maxSide / Math.max(c.width, c.height)); if (s >= 1) return c;
  const o = mkCanvas(c.width * s, c.height * s); const x = o.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, o.width, o.height); return o;
}

/* ═════════ ตรวจจับขอบกระดาษ ═════════
 * ขาวกว่าพื้นหลัง → Otsu → ก้อนใหญ่ที่สุดใกล้กลางภาพ → หา 4 มุมสุดโต่ง
 * คืน {quad:[TL,TR,BR,BL] (0..1), area} หรือ null  */
const det = { c: null };
function detectQuad(src, sw, sh, maxSide) {
  const s = Math.min(1, maxSide / Math.max(sw, sh)), w = Math.round(sw * s), h = Math.round(sh * s);
  if (!det.c) det.c = document.createElement('canvas');
  det.c.width = w; det.c.height = h;
  const cx = det.c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(src, 0, 0, sw, sh, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data, n = w * h;
  let g = new Uint8Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
  g = boxBlur(g, w, h, 2);
  // Otsu
  const hist = new Float64Array(256); for (let i = 0; i < n; i++) hist[g[i]]++;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let wb = 0, sb = 0, best = 0, th = 127;
  for (let t = 0; t < 256; t++) { wb += hist[t]; if (!wb) continue; const wf = n - wb; if (!wf) break; sb += t * hist[t]; const mb = sb / wb, mf = (sum - sb) / wf, v = wb * wf * (mb - mf) * (mb - mf); if (v > best) { best = v; th = t; } }
  const lab = new Int32Array(n), stack = new Int32Array(n);
  let bestC = null, bestScore = 0;
  for (let i = 0; i < n; i++) {
    if (g[i] <= th || lab[i]) continue;
    let sp = 0, area = 0, sx = 0, sy = 0; stack[sp++] = i; lab[i] = 1;
    let mnS = 1e9, mxS = -1e9, mnD = 1e9, mxD = -1e9, TL, BR, TR, BL;
    while (sp) {
      const p = stack[--sp], x = p % w, y = (p / w) | 0; area++; sx += x; sy += y;
      const a = x + y, b = x - y;
      if (a < mnS) { mnS = a; TL = [x, y]; } if (a > mxS) { mxS = a; BR = [x, y]; }
      if (b > mxD) { mxD = b; TR = [x, y]; } if (b < mnD) { mnD = b; BL = [x, y]; }
      if (x > 0 && g[p - 1] > th && !lab[p - 1]) { lab[p - 1] = 1; stack[sp++] = p - 1; }
      if (x < w - 1 && g[p + 1] > th && !lab[p + 1]) { lab[p + 1] = 1; stack[sp++] = p + 1; }
      if (y > 0 && g[p - w] > th && !lab[p - w]) { lab[p - w] = 1; stack[sp++] = p - w; }
      if (y < h - 1 && g[p + w] > th && !lab[p + w]) { lab[p + w] = 1; stack[sp++] = p + w; }
    }
    if (area < n * 0.1) continue;
    const dx = sx / area / w - .5, dy = sy / area / h - .5, score = area * (1 - Math.min(.8, Math.hypot(dx, dy)));
    if (score > bestScore) { bestScore = score; bestC = { area, q: [TL, TR, BR, BL] }; }
  }
  if (!bestC || bestC.area > n * 0.97) return null;
  const q = bestC.q, qa = polyArea(q);
  if (qa < n * 0.12 || bestC.area / qa < 0.62) return null;           // ไม่ใช่สี่เหลี่ยม
  if (!isConvex(q)) return null;
  return { quad: q.map(p => ({ x: p[0] / w, y: p[1] / h })), area: qa / n };
}
function boxBlur(src, w, h, r) {
  const tmp = new Uint8Array(src.length), out = new Uint8Array(src.length), k = 2 * r + 1;
  for (let y = 0; y < h; y++) { let acc = 0; const o = y * w; for (let x = -r; x <= r; x++) acc += src[o + Math.min(w - 1, Math.max(0, x))];

async function reprocess() { const p = state.pages[state.reviewIdx]; $('rvPic').style.opacity = .4; await processPage(p); $('rvPic').style.opacity = 1; renderStrip(); openReview(state.reviewIdx); }
document.querySelectorAll('#rvMode button').forEach(b => b.onclick = () => { state.pages[state.reviewIdx].mode = b.dataset.m; reprocess(); });
$('rvCrop').onclick = () => { const p = state.pages[state.reviewIdx]; p.crop = !p.crop; reprocess(); };

/* ═════════ ปรับมุมกระดาษเอง ═════════ */
const cn = { pts: null, def: null, url: '' };
const clamp01 = v => Math.max(0, Math.min(1, v));
function openCorners() {
  const p = state.pages[state.reviewIdx], g = p.guide;
  cn.def = g ? [{ x: g.x, y: g.y }, { x: g.x + g.w, y: g.y }, { x: g.x + g.w, y: g.y + g.h }, { x: g.x, y: g.y + g.h }]
             : [{ x: .08, y: .08 }, { x: .92, y: .08 }, { x: .92, y: .92 }, { x: .08, y: .92 }];
  cn.pts = (p.quad || cn.def).map(q => ({ x: q.x, y: q.y }));
  cn.url = URL.createObjectURL(p.orig); $('cnImg').src = cn.url;
  $('corner').classList.remove('hidden'); drawCorners();
}
function drawCorners() {
  $('cnPoly').setAttribute('points', cn.pts.map(q => q.x + ',' + q.y).join(' '));
  document.querySelectorAll('.hd').forEach(h => { const q = cn.pts[+h.dataset.i]; h.style.left = q.x * 100 + '%'; h.style.top = q.y * 100 + '%'; });
}
function closeCorners() { $('corner').classList.add('hidden'); if (cn.url) URL.revokeObjectURL(cn.url); cn.url = ''; }
document.querySelectorAll('.hd').forEach(h => {
  h.onpointerdown = e => { h.setPointerCapture(e.pointerId); h._d = 1; e.preventDefault(); };
  h.onpointermove = e => { if (!h._d) return; const r = $('cnWrap').getBoundingClientRect(); cn.pts[+h.dataset.i] = { x: clamp01((e.clientX - r.left) / r.width), y: clamp01((e.clientY - r.top) / r.height) }; drawCorners(); };
  h.onpointerup = h.onpointercancel = () => { h._d = 0; };
});
$('rvCorners').onclick = openCorners;
$('cnCancel').onclick = closeCorners;
$('cnReset').onclick = () => { cn.pts = cn.def.map(q => ({ x: q.x, y: q.y })); drawCorners(); };
$('cnOk').onclick = async () => {
  const p = state.pages[state.reviewIdx]; p.quad = cn.pts.map(q => ({ x: q.x, y: q.y })); p.crop = true; p.kind = 'manual';
  closeCorners(); await reprocess();
};

/* ═════════ Finish: สร้าง PDF + อัปโหลด ═════════ */
$('btnFinish').onclick = () => { stopStream(); closeReview(); show('s-fin'); $('finType').textContent = typeLabel(); $('finPages').textContent = state.pages.length + ' หน้า'; state.pdf = null; runFinish(); };
const setBar = f => $('finBar').firstElementChild.style.width = Math.round(f * 100) + '%';
const msg = (t, bad) => { $('finMsg').className = bad ? 'err' : ''; $('finMsg').textContent = t; };
const gs = async (name, ...args) => {
  const body = name === 'uploadChunks' ? { action: name, token: args[0], key: args[1], start: args[2], chunks: args[3] } : { action: name, meta: args[0] };
  const r = await fetch(BOOT.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'server_error');
  return j.data;
};
const blobToB64 = b => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ng; r.readAsDataURL(b); });
function errText(e) {
  const m = String((e && e.message) || e);
  if (/other_name_required/.test(m)) return 'กรุณาระบุชื่อเอกสาร';
  if (/chunk_missing/.test(m)) return 'ข้อมูลที่ส่งไม่ครบ กรุณากดลองใหม่';
  if (/pdf_too_large/.test(m)) return 'ไฟล์ใหญ่เกินไป ลดจำนวนหน้าหรือแบ่งเป็นหลายไฟล์';
  if (/unauthorized/.test(m)) { const t = BOOT.token; return 'ไม่มีสิทธิ์ใช้งาน (ลิงก์ไม่ถูกต้อง) — token ในลิงก์: ' + (t ? t.slice(0, 2) + '…' + t.slice(-2) + ' (' + t.length + ' ตัว)' : 'ว่าง (ลิงก์ไม่มี t=)') + ' — ถ้าไม่ตรงกับที่ตั้ง ให้ปิดหน้านี้แล้วเปิดจากปุ่มใน AppSheet ใหม่'; }
  if (/Drive|Authorization|permission/i.test(m)) return 'ไม่มีสิทธิ์เข้าถึง Google Drive — แจ้งผู้ดูแลระบบให้รัน setup() และอนุญาตสิทธิ์';
  return 'บันทึกไม่สำเร็จ: ' + m;
}

async function buildPdf() {
  if (!(window.jspdf && window.jspdf.jsPDF)) throw new Error('โหลดไลบรารี PDF ไม่สำเร็จ (ตรวจอินเทอร์เน็ต)');
  const { jsPDF } = window.jspdf; let doc = null;
  for (let i = 0; i < state.pages.length; i++) {
    const p = state.pages[i], u8 = new Uint8Array(await p.proc.arrayBuffer());
    const pw = p.w >= p.h ? 842 : 595, ph = pw * p.h / p.w, o = p.w >= p.h ? 'l' : 'p';
    if (!doc) doc = new jsPDF({ unit: 'pt', format: [pw, ph], orientation: o, compress: true }); else doc.addPage([pw, ph], o);
    doc.addImage(u8, 'JPEG', 0, 0, pw, ph, undefined, 'FAST');
    setBar(0.1 * (i + 1) / state.pages.length * 4);   // 0 → 40%
  }
  return new Blob([doc.output('arraybuffer')], { type: 'application/pdf' });
}

async function runFinish() {
  $('finBtns').innerHTML = ''; $('finResult').innerHTML = ''; $('finTitle').textContent = 'กำลังสร้าง PDF…'; setBar(0.02);
  try {
    if (!state.pdf) { msg('รวมภาพเป็น PDF…'); state.pdf = await buildPdf(); }
    if (!navigator.onLine) throw new Error('offline');
    const b64 = await blobToB64(state.pdf), key = state.sid + '-' + state.pdf.size + '-' + state.pages.length;
    const chunks = []; for (let i = 0; i < b64.length; i += CHUNK) chunks.push(b64.slice(i, i + CHUNK));
    msg('กำลังอัปโหลด… (PDF ' + (state.pdf.size / 1048576).toFixed(1) + ' MB)');
    for (let i = 0; i < chunks.length; i += CHUNKS_PER_CALL) {
      await gs('uploadChunks', BOOT.token, key, i, chunks.slice(i, i + CHUNKS_PER_CALL));
      setBar(0.4 + 0.5 * Math.min(1, (i + CHUNKS_PER_CALL) / chunks.length));
    }
    msg('กำลังบันทึกลง Google Drive…');
    const r = await gs('finalizePdf', { token: BOOT.token, key, totalChunks: chunks.length, typeId: state.typeId, other: state.other, pages: state.pages.length, user: BOOT.user, rowId: BOOT.rowId, app: BOOT.app, sheet: BOOT.sheet, tab: BOOT.tab, sub: BOOT.sub });
    setBar(1); onSuccess(r);
  } catch (e) {
    const off = !navigator.onLine || /offline|NetworkError|Failed to fetch/i.test(String(e && e.message));
    $('finTitle').textContent = 'บันทึกไม่สำเร็จ'; msg(off ? 'อินเทอร์เน็ตขัดข้อง — ภาพทั้งหมดยังอยู่ในเครื่อง ไม่หาย กดลองใหม่เมื่อสัญญาณกลับมา' : errText(e), true);
    const b = document.createElement('button'); b.className = 'primary'; b.style.cssText = 'width:100%;margin-bottom:8px'; b.textContent = 'ลองบันทึกอีกครั้ง'; b.onclick = runFinish; $('finBtns').appendChild(b);
    if (state.pdf) { const d = document.createElement('a'); d.className = 'btn'; d.textContent = 'ดาวน์โหลด PDF เก็บไว้ในเครื่อง'; d.href = URL.createObjectURL(state.pdf); d.download = 'scan.pdf'; d.target = '_blank'; $('finBtns').appendChild(d); }
    const bk = document.createElement('button'); bk.style.width = '100%'; bk.textContent = '‹ กลับไปแก้ไข/ถ่ายเพิ่ม'; bk.onclick = () => { state.pdf = null; enterCamera(); }; $('finBtns').appendChild(bk);
  }
}

function onSuccess(r) {
  $('finTitle').textContent = '✓ บันทึกเรียบร้อย';
  msg(r.duplicate ? 'ไฟล์นี้ถูกบันทึกไว้แล้ว (ไม่สร้างซ้ำ)' : 'ส่งข้อมูลกลับ AppSheet แล้ว');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  $('finResult').innerHTML = '<div class="k">ชื่อไฟล์</div><div class="v">' + esc(r.fileName) + '</div><div class="k">วันที่สแกน</div><div class="v">' + esc(r.scannedAt) + '</div>';
  $('finPages').textContent = r.pages + ' หน้า';
  const bx = $('finBtns'); bx.innerHTML = '';
  const a = document.createElement('a'); a.className = 'btn'; a.href = r.url; a.target = '_blank'; a.textContent = 'เปิดไฟล์ PDF ใน Google Drive'; bx.appendChild(a);
  if (BOOT.returnUrl) {
    const r2 = document.createElement('button'); r2.className = 'ok'; r2.style.cssText = 'width:100%;margin-bottom:8px;padding:14px';
    let left = 4; const go = () => { location.href = BOOT.returnUrl; };
    const tick = () => { r2.textContent = 'กลับไป AppSheet (' + left + ')'; if (left-- <= 0) go(); else r._t = setTimeout(tick, 1000); };
    r2.onclick = () => { clearTimeout(r._t); go(); }; bx.insertBefore(r2, bx.firstChild); tick();
  }
  state.pages.forEach(p => URL.revokeObjectURL(p.url)); state.pages = []; state.pdf = null; DB.clear();
}
function newBatch() { state.sid = uid(); state.other = BOOT.other || ''; if (!BOOT.typeId) state.typeId = ''; DB.setSession(); show('s-type'); renderTypes(); $('resume').classList.add('hidden'); }

/* ═════════ เริ่มต้น + กู้งานค้าง ═════════ */
(async function init() {
  window.addEventListener('beforeunload', e => { if (state.pages.length) { e.preventDefault(); e.returnValue = ''; } });
  await DB.open();
  const sess = await DB.getSession();
  if (sess && sess.ids && sess.ids.length) {
    const box = $('resume'); box.classList.remove('hidden');
    box.innerHTML = 'พบงานสแกนที่ยังไม่บันทึก <b>' + sess.ids.length + ' หน้า</b> (เช่น จากเน็ตหลุด/ปิดหน้าจอ)<br>';
    const y = document.createElement('button'); y.className = 'ok'; y.textContent = 'ทำต่อ';
    const n = document.createElement('button'); n.className = 'danger'; n.textContent = 'ทิ้ง';
    y.onclick = async () => {
      state.sid = sess.sid; state.typeId = sess.typeId; state.other = sess.other || '';
      for (const id of sess.ids) { const r = await DB.getPage(id); if (r && r.proc) { r.url = URL.createObjectURL(r.proc); r.kind = r.quad ? 'quad' : r.guide ? 'guide' : 'none'; state.pages.push(r); } }
      $('otherName').value = state.other; box.classList.add('hidden'); renderTypes();
      if (state.pages.length) enterCamera();
    };
    n.onclick = async () => { await DB.clear(); box.classList.add('hidden'); };
    box.appendChild(y); box.appendChild(n);
  }
  if (!state.sid) state.sid = uid();
  renderTypes();
  // ถ้า AppSheet ส่งประเภทมาครบแล้ว → ข้ามขั้นเลือก ไปกล้องทันที
  const ready = state.typeId && (state.typeId !== 'other' || state.other.trim());
  if (ready && !(sess && sess.ids && sess.ids.length)) $('btnStart').click();
})();
</script>
